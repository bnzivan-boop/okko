<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKKO CAP — Marketplace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<!-- Backend wiring: config.js is optional. Without it the site runs on the
     built-in demo data; with it, listings, documents, leads and payments come
     from Supabase. See backend/README.md -->
<script src="config.js" onerror="void 0"></script>
<script src="api.js"></script>
<style>
:root{
  --ink:#08090F; --ink2:#0E1120; --ink3:#161A2E;
  --paper:#F2F3F7; --card:#FFFFFF;
  --blue:#2447E6; --blue-d:#1A34AE; --blue-l:#7B93FF; --blue-t:#E8ECFC;
  --bronze:#C79A3E; --bronze-t:#F7F0DE;
  --tx:#0E1018; --mut:#6A7086; --mut-d:#8E96B4; --line:#E3E5EC; --line-d:#22273F;
  --ok:#177A50; --okt:#E2F2EA;
  --f:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--tx);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:var(--f);cursor:pointer;border:0;background:none;color:inherit}
img,svg{display:block;max-width:100%}
::selection{background:var(--blue);color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.035em;line-height:1.02;text-wrap:balance}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}
.dk .eyebrow,.phead .eyebrow{color:var(--mut-d)}
.dk .eyebrow::before,.phead .eyebrow::before{background:var(--blue-l)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:12px;border-radius:99px;padding:9px 10px 9px 22px;font-size:14.5px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;border:1px solid transparent;transition:background .2s,color .2s,border-color .2s,opacity .2s}
.btn .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .25s}
.btn:hover .ic{transform:rotate(45deg)}
.btn .ic svg{width:12px;height:12px}
.btn-w{background:#fff;color:var(--ink)}
.btn-w .ic{background:var(--ink);color:#fff}
.btn-w:hover{background:#E8EAF4}
.btn-b{background:var(--blue);color:#fff}
.btn-b .ic{background:rgba(255,255,255,.18);color:#fff}
.btn-b:hover{background:var(--blue-d)}
.btn-d{background:var(--ink);color:#fff}
.btn-d .ic{background:rgba(255,255,255,.14);color:#fff}
.btn-d:hover{background:var(--ink3)}
.btn-gh{background:transparent;color:#fff;border-color:rgba(255,255,255,.22)}
.btn-gh .ic{background:rgba(255,255,255,.1);color:#fff}
.btn-gh:hover{border-color:rgba(255,255,255,.6)}
.btn-o{background:transparent;color:var(--tx);border-color:var(--line)}
.btn-o .ic{background:var(--tx);color:#fff}
.btn-o:hover{border-color:var(--tx)}
.btn-sm{padding:7px 8px 7px 18px;font-size:13.5px}
.btn-sm .ic{width:26px;height:26px}
.btn-lg{padding:11px 12px 11px 26px;font-size:16px}
.btn-lg .ic{width:36px;height:36px}
.btn.full{width:100%;justify-content:space-between}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue-l);outline-offset:3px}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:60;padding:14px 0;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.stuck{background:rgba(8,9,15,.74);backdrop-filter:blur(16px);border-bottom-color:var(--line-d)}
.hd{display:flex;align-items:center;gap:30px;color:#fff}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:600;letter-spacing:-.02em;flex:none}
.logo b{color:var(--blue-l);font-weight:600}
.logo .brand{height:26px;width:auto;max-width:190px;object-fit:contain}
.ft .about .logo .brand{height:30px;max-width:220px}
nav.main{display:flex;gap:24px;font-size:14px;color:rgba(255,255,255,.6)}
nav.main a{position:relative;padding:2px 0;white-space:nowrap}
nav.main a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:#fff;transition:right .25s}
nav.main a:hover,nav.main a.on{color:#fff}
nav.main a:hover::after,nav.main a.on::after{right:0}
.hd .sp{flex:1}
.hd .sign{font-size:14px;color:rgba(255,255,255,.72);white-space:nowrap}
.hd .sign:hover{color:#fff}
.hd .btn .short{display:none}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--ink);color:#fff;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:104px 0 128px;overflow:hidden}
.hero>.wrap{width:100%}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:88px 88px;mask-image:radial-gradient(120% 90% at 70% 10%,#000 20%,transparent 75%)}
.hero .glow{position:absolute;width:900px;height:900px;right:-180px;top:-380px;border-radius:50%;background:radial-gradient(circle,rgba(36,71,230,.42),rgba(36,71,230,0) 62%);filter:blur(20px)}
.hero .glow2{position:absolute;width:620px;height:620px;left:-220px;bottom:-260px;border-radius:50%;background:radial-gradient(circle,rgba(199,154,62,.18),rgba(199,154,62,0) 65%)}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;align-items:end;flex:1}
.hero h1{font-size:clamp(44px,6.8vw,94px);font-weight:600;max-width:14ch;margin:18px 0 0}
.hero h1 em{font-style:normal;color:var(--blue-l)}
.hero h1 .thin{font-weight:300;color:rgba(255,255,255,.55)}
.hero p.sub{margin:22px 0 30px;font-size:17px;line-height:1.55;color:rgba(255,255,255,.62);max-width:52ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}

.float{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);border-radius:14px;padding:12px;margin-bottom:6px}
.float .th{border-radius:9px;overflow:hidden;aspect-ratio:16/9;background:#111}
.float .fl{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:13px 5px 3px}
.float .tag{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--blue-l)}
.float h4{font-size:17px;margin-top:3px}
.float small{display:block;font-size:12.5px;color:rgba(255,255,255,.5);margin-top:3px}
.float .go{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none;transition:transform .25s}
.float:hover .go{transform:rotate(45deg)}

.hero-foot{position:relative;z-index:2;display:flex;gap:56px;flex-wrap:wrap;padding:28px 0 0;margin-top:38px}
.hero-foot div b{display:block;font-size:30px;font-weight:500;letter-spacing:-.04em}
.hero-foot div span{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut-d)}
.ghost{position:absolute;left:0;right:0;bottom:-.36em;z-index:1;font-size:clamp(96px,20.2vw,290px);font-weight:600;letter-spacing:-.05em;line-height:.8;text-align:center;color:transparent;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.03));-webkit-background-clip:text;background-clip:text;user-select:none;pointer-events:none;white-space:nowrap}

/* ---------- page head (subpages) ---------- */
.phead{position:relative;background:var(--ink);color:#fff;overflow:hidden;padding:132px 0 54px}
.phead .glow{position:absolute;width:760px;height:760px;right:-160px;top:-420px;border-radius:50%;background:radial-gradient(circle,rgba(36,71,230,.38),rgba(36,71,230,0) 62%)}
.phead>.wrap{position:relative;z-index:2}
.phead h1{font-size:clamp(34px,5.2vw,66px);margin-top:14px}
.phead p.sub{margin-top:18px;font-size:16.5px;color:rgba(255,255,255,.6);max-width:60ch}
.phead .crumb{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:16px}
.phead .crumb a:hover{color:#fff}
.phead .row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}

/* ---------- ticker ---------- */
.ticker{background:#05060B;border-top:1px solid var(--line-d);border-bottom:1px solid var(--line-d);overflow:hidden;white-space:nowrap;color:rgba(255,255,255,.72);font-size:12.5px}
.ticker .in{display:inline-block;padding:12px 0;animation:tick 60s linear infinite}
.ticker .it{display:inline-block;margin-right:40px;transition:color .2s}
.ticker .it:hover{color:#fff}
.ticker .it:hover .tag{color:#fff}
.ticker:hover .in{animation-play-state:paused}
.ticker .it b{color:#fff;font-weight:500}
.ticker .tag{color:var(--blue-l);font-weight:600;letter-spacing:.08em;font-size:11px}
.ticker .up{color:#5CD99A}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- statement ---------- */
.stmt{background:var(--paper);padding:100px 0 0}
.stmt .top{margin-bottom:36px}
.stmt h2{font-size:clamp(28px,4.1vw,58px);font-weight:500;letter-spacing:-.035em;line-height:1.12;max-width:30ch;text-wrap:pretty}
.stmt h2 .dim{color:#A6ABBC;font-weight:400}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:72px 0 110px;align-items:start}
.tile{border-radius:18px;padding:22px;min-height:286px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.tile:hover{transform:translateY(-5px);box-shadow:0 22px 44px rgba(10,12,20,.14)}
.tile.s1{margin-top:0}.tile.s2{margin-top:38px}.tile.s3{margin-top:74px}.tile.s4{margin-top:18px}
.tile-d{background:var(--ink);color:#fff}
.tile-l{background:#fff;color:var(--tx);border:1px solid var(--line)}
.tile-a{background:linear-gradient(160deg,var(--blue),#16309E);color:#fff}
.pill{align-self:flex-start;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:6px 13px;border-radius:99px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.82)}
.tile-l .pill{border-color:var(--line);color:var(--mut)}
.tile h3{font-size:21px;margin-bottom:9px;line-height:1.1}
.tile p{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.55)}
.tile-l p{color:var(--mut)}
.tile-a p{color:rgba(255,255,255,.78)}
.tile .dot{position:absolute;top:24px;right:24px;width:8px;height:8px;border-radius:50%;background:var(--blue-l)}
.tile-l .dot{background:var(--blue)}
.tile-a .dot{background:#fff}
.tile .streak{position:absolute;inset:auto -20% -30% -20%;height:180px;background:radial-gradient(60% 100% at 50% 100%,rgba(123,147,255,.22),transparent 70%)}

/* ---------- sections ---------- */
section.sec{padding:96px 0}
section.sec.tight{padding:72px 0}
.dk{background:var(--ink);color:#fff}
.dk .sec-hd h2,.dk .sec-hd h3,.dk .step h3,.dk .offer h3{color:#fff}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.sec-hd h2{font-size:clamp(30px,3.4vw,46px);margin-top:14px}
.sec-hd p.sd{color:var(--mut);max-width:50ch;margin-top:14px;font-size:15px}
.dk .sec-hd p.sd{color:rgba(255,255,255,.6)}

/* ---------- deal cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.card{border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative;background:#fff;color:var(--tx);border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);box-shadow:0 22px 44px rgba(10,12,20,.13)}
.card.dark{background:var(--ink2);border-color:#1E2440;color:#fff}
.cov{position:relative;margin:10px 10px 0;border-radius:12px;overflow:hidden;aspect-ratio:16/10;background:#0d0f18}
.cov svg,.cov img{width:100%;height:100%;object-fit:cover}
.dmedia img,.thumbs img,.float .th img,.lrow .th img{width:100%;height:100%;object-fit:cover}
.badges{position:absolute;top:11px;left:11px;display:flex;gap:7px;flex-wrap:wrap}
.bdg{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:6px 11px;border-radius:99px;backdrop-filter:blur(8px)}
.bdg-sale{background:var(--blue);color:#fff}
.bdg-raise{background:rgba(12,14,24,.72);color:#EBCB84;border:1px solid rgba(199,154,62,.5)}
.bdg-chip{background:rgba(255,255,255,.88);color:var(--ink)}
.vid{position:absolute;right:11px;bottom:11px;display:flex;align-items:center;gap:7px;background:rgba(7,9,16,.72);backdrop-filter:blur(8px);color:#fff;font-size:11px;font-weight:500;letter-spacing:.04em;padding:6px 11px;border-radius:99px}
.vid i{width:0;height:0;border-left:7px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.cbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
.cbody .ind{font-size:11.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;gap:10px}
.card.dark .cbody .ind{color:var(--mut-d)}
.cbody .vf{color:var(--ok);letter-spacing:.02em;text-transform:none;display:flex;align-items:center;gap:5px;font-weight:500}
.card.dark .cbody .vf{color:#5CD99A}
.cbody h3{font-size:23px}
.cbody p.tg{font-size:14px;color:var(--mut);flex:1;line-height:1.5}
.card.dark .cbody p.tg{color:rgba(255,255,255,.55)}
.cmet{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.cmet span{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.card.dark .cmet span{color:var(--mut-d);border-color:#242A44}
.cmet b{color:var(--tx);font-weight:500}
.card.dark .cmet b{color:#fff}
.cnum{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:6px;gap:10px}
.card.dark .cnum{border-color:#20263E}
.cnum b{font-size:24px;font-weight:600;letter-spacing:-.03em;display:block}
.cnum span{font-size:12px;color:var(--mut)}
.card.dark .cnum span{color:var(--mut-d)}
.cnum .go{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;transition:transform .25s}
.card.dark .cnum .go{background:#fff;color:var(--ink)}
.card:hover .cnum .go{transform:rotate(45deg)}
.go svg{width:12px;height:12px}
.fnote{font-size:11px;color:var(--mut)}
.card.dark .fnote{color:var(--mut-d)}

/* ---------- filters ---------- */
.filters{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:24px;overflow:hidden}
.frow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px}
.frow+.frow{border-top:1px solid var(--line);background:#FAFAFC}
.flabel{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-right:6px;flex:none}
.ftabs{display:flex;gap:4px;background:var(--paper);border-radius:99px;padding:4px}
.ftabs button{padding:8px 18px;font-size:13.5px;font-weight:500;color:var(--mut);border-radius:99px;transition:background .2s,color .2s}
.ftabs button.on{background:var(--ink);color:#fff}
.ftabs button:not(.on):hover{color:var(--tx)}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-size:13.5px;color:var(--tx);transition:border-color .2s,background .2s,color .2s}
.chip:hover{border-color:var(--tx)}
.chip.on{background:var(--blue-t);border-color:var(--blue);color:var(--blue-d)}
.filters .sp{flex:1}
.fright{display:flex;gap:10px;align-items:center}
.filters input[type=search],.filters select{border:1px solid var(--line);border-radius:99px;padding:10px 16px;font-size:13.5px;font-family:var(--f);background:var(--paper);color:var(--tx)}
.filters input[type=search]{min-width:210px}
.filters input[type=search]:focus,.filters select:focus{background:#fff;border-color:var(--blue);outline:none}
.rescount{font-size:13.5px;color:var(--mut);margin:0 0 18px}

/* ---------- deal page ---------- */
.deal{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;padding:34px 0 96px;align-items:start}
.dmedia{position:relative;border-radius:18px;overflow:hidden;background:#0d0f18;aspect-ratio:16/10}
.dmedia svg{width:100%;height:100%}
.dmedia .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,9,16,.22)}
.dmedia .play button{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;transition:transform .25s}
.dmedia .play button:hover{transform:scale(1.06)}
.dmedia .play i{width:0;height:0;border-left:20px solid var(--ink);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.dmedia .lbl{position:absolute;left:14px;bottom:14px;background:rgba(7,9,16,.75);backdrop-filter:blur(8px);color:#fff;font-size:11.5px;font-weight:500;letter-spacing:.06em;padding:7px 13px;border-radius:99px}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px}
.thumbs .tb{aspect-ratio:16/10;border-radius:10px;overflow:hidden;opacity:.55;transition:opacity .2s,box-shadow .2s;cursor:pointer;padding:0;background:var(--paper);position:relative}
.thumbs .tb:hover{opacity:.85}
.thumbs .tb.on{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.thumbs .tbv{display:grid;place-items:center;gap:4px;background:var(--ink);color:#fff;opacity:1;font-size:11px;letter-spacing:.06em}
.thumbs .tbv i{width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);font-size:26px;line-height:1;display:grid;place-items:center;z-index:3;transition:transform .2s,background .2s;padding-bottom:4px}
.gnav:hover{background:#fff;transform:translateY(-50%) scale(1.06)}
.gnav.prev{left:14px}
.gnav.next{right:14px}
.gcount{position:absolute;right:14px;top:14px;z-index:3;background:rgba(7,9,16,.7);backdrop-filter:blur(8px);color:#fff;font-size:12px;padding:6px 12px;border-radius:99px}
.ltile{position:absolute;left:14px;bottom:14px;z-index:3;width:56px;height:56px;border-radius:14px;background:#fff;box-shadow:0 6px 20px rgba(10,12,20,.18);display:grid;place-items:center;overflow:hidden;padding:7px}
.ltile img{width:100%;height:100%;object-fit:contain}
.ltile.empty{font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--mut);padding:0}
.ltile.lg{position:static;width:72px;height:72px;border-radius:18px;padding:9px;flex:none}
.ltile.sm{position:static;width:38px;height:38px;border-radius:10px;padding:5px;font-size:13px;flex:none}
.dsec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 30px;margin-top:18px}
.dsec h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:18px;font-weight:500}
.dsec p{margin-bottom:13px;max-width:72ch;color:#2A2E3D}
.dsec p:last-child{margin-bottom:0}
.dsec ul{list-style:none;display:grid;gap:12px}
.dsec ul li{padding-left:22px;position:relative;font-size:15px}
.dsec ul li::before{content:"";position:absolute;left:0;top:10px;width:9px;height:2px;border-radius:2px;background:var(--blue)}
.ftable{width:100%;border-collapse:collapse;font-size:14.5px}
.ftable td{padding:12px 0;border-bottom:1px solid var(--line)}
.ftable tr:last-child td{border-bottom:0}
.ftable td:last-child{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.rail{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px}
.fact{background:var(--ink);color:#fff;border-radius:18px;padding:26px;position:relative;overflow:hidden}
.fact .glowf{position:absolute;width:420px;height:420px;right:-190px;top:-230px;border-radius:50%;background:radial-gradient(circle,rgba(36,71,230,.5),transparent 62%)}
.fact>*{position:relative;z-index:2}
.fact .fl{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut-d)}
.fact .fv{font-size:42px;font-weight:600;letter-spacing:-.04em;margin:4px 0 6px}
.fact .fn{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:20px}
.fact .rows{border-top:1px solid rgba(255,255,255,.1);margin-bottom:20px}
.fact .rows div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.07)}
.fact .rows div:last-child{border-bottom:0}
.fact .rows span{color:var(--mut-d)}
.fact .rows b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.unlocked{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ok);background:var(--okt);border-radius:12px;padding:11px 14px;margin-bottom:14px}
.advc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;font-size:13.5px;color:var(--mut);line-height:1.6}
.advc b{color:var(--tx);font-weight:500}
.advc .vf{color:var(--ok);font-weight:500;margin-bottom:8px;display:flex;gap:6px;align-items:center}

/* ---------- steps / offers ---------- */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.step{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;transition:transform .25s,box-shadow .25s}
.step:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(10,12,20,.1)}
.dk .step{background:var(--ink2);border-color:#1D2238}
.step b.n{font-size:11.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.dk .step b.n{color:var(--blue-l)}
.step h3{font-size:20px;margin:12px 0 9px}
.step p{font-size:14px;color:var(--mut);line-height:1.5}
.dk .step p{color:rgba(255,255,255,.55)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.offer{border-radius:20px;padding:32px}
.offer.d{background:var(--ink2);border:1px solid #1D2238;color:#fff}
.offer.l{background:#fff;border:1px solid var(--line)}
.offer h3{font-size:26px;margin:10px 0 12px}
.offer p.od{font-size:14.5px;margin-bottom:18px;color:var(--mut)}
.offer.d p.od{color:rgba(255,255,255,.6)}
.offer .pr{font-size:42px;font-weight:600;letter-spacing:-.04em;margin-bottom:6px}
.offer .pr small{font-size:13px;color:var(--mut);font-weight:400;letter-spacing:0}
.offer.d .pr small{color:var(--mut-d)}
.offer ul{list-style:none;margin:16px 0 24px;display:grid;gap:10px;font-size:14.5px}
.offer.d ul{color:rgba(255,255,255,.78)}
.offer.l ul{color:#2A2E3D}
.offer ul li{padding-left:22px;position:relative}
.offer ul li::before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;border:2px solid var(--blue)}
.offer.d ul li::before{border-color:var(--blue-l)}

/* ---------- wizard ---------- */
.wiz{max-width:820px;margin:0 auto;padding:44px 32px 96px}
.wsteps{display:flex;gap:6px;margin:24px 0 28px}
.wsteps i{flex:1;height:4px;background:var(--line);border-radius:99px;transition:background .3s}
.wsteps i.on{background:var(--blue)}
.wcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 34px}
.wtitle{font-size:clamp(28px,3.4vw,38px);margin-top:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fgrid .full{grid-column:1/-1}
label.f{display:block;font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:15px;font-family:var(--f);background:#FBFBFD;color:var(--tx);transition:border-color .2s,background .2s}
input.f:focus,select.f:focus,textarea.f:focus{background:#fff;border-color:var(--blue);outline:none}
textarea.f{resize:vertical}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pick button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:left;transition:border-color .2s,transform .2s}
.pick button:hover{border-color:var(--tx);transform:translateY(-3px)}
.pick button.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.pick h3{font-size:21px;margin-bottom:8px}
.pick p{font-size:14px;color:var(--mut)}
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:34px;text-align:center;color:var(--mut);font-size:14px;background:#FBFBFD;line-height:1.6}
.drop b{color:var(--tx);font-weight:500}
.drop.req{border-color:rgba(199,154,62,.6);background:var(--bronze-t)}
.req{background:var(--bronze-t);color:#8A6A20;border-radius:99px;padding:3px 9px;font-size:10px;letter-spacing:.08em;margin-left:8px}
.logobox{display:flex;gap:18px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:#FBFBFD}
.lprev{width:88px;height:88px;border-radius:16px;border:1.5px dashed var(--line);background:#fff;display:grid;place-items:center;flex:none;font-size:10.5px;letter-spacing:.12em;color:var(--mut);overflow:hidden;padding:8px}
.lprev.has{border-style:solid}
.lprev img{width:100%;height:100%;object-fit:contain}
.lrule{font-size:12.5px;color:var(--mut);line-height:1.6;margin-top:12px;max-width:62ch}
.uslot{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;background:#FBFBFD}
.uhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.uhead b{font-size:15px;font-weight:500;display:block}
.uhead span{font-size:12.5px;color:var(--mut)}
.ufiles{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.ufile{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 8px 6px 6px;font-size:13px}
.ufile i{font-style:normal;font-size:9.5px;font-weight:600;letter-spacing:.06em;background:var(--paper);color:var(--mut);border-radius:99px;padding:4px 8px}
.ufile .rm{font-size:16px;line-height:1;color:var(--mut);padding:0 2px}
.ufile .rm:hover{color:#B0342F}
.uempty{font-size:13px;color:var(--mut)}
.uacts{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wnav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.plan{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:left;position:relative;transition:border-color .2s}
.plan:hover{border-color:var(--tx)}
.plan.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.plan .pl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:500}
.plan .pp{font-size:30px;font-weight:600;letter-spacing:-.04em;margin:6px 0 4px}
.plan .save{position:absolute;top:16px;right:16px;background:var(--okt);color:var(--ok);font-size:11px;font-weight:600;padding:5px 11px;border-radius:99px;letter-spacing:.05em}
.paybox{border:1px solid var(--line);border-radius:16px;padding:20px 22px;background:#FBFBFD}
.paybox .row{display:flex;justify-content:space-between;font-size:14.5px;padding:7px 0}
.paybox .row.t{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-weight:600;font-size:17px}
.note{font-size:12.5px;color:var(--mut);margin-top:16px;line-height:1.6}
.chk{display:flex;gap:10px;font-size:13.5px;color:var(--mut);align-items:flex-start}
.chk input{margin-top:3px;accent-color:var(--blue)}
.done{max-width:640px;margin:0 auto;text-align:center;padding:120px 32px 120px}
.done .ok{width:78px;height:78px;border-radius:50%;background:var(--okt);color:var(--ok);display:grid;place-items:center;font-size:34px;margin:0 auto 26px}
.done h1{font-size:clamp(32px,4vw,44px);margin-bottom:14px}
.done p{color:var(--mut);margin-bottom:30px;line-height:1.6}

/* ---------- account ---------- */
.acc{padding:40px 0 96px}
.astats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:0 0 34px}
.astat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.astat b{font-size:34px;font-weight:600;letter-spacing:-.04em;display:block}
.astat span{font-size:12px;color:var(--mut);letter-spacing:.07em;text-transform:uppercase}
.astat.d{background:var(--ink);color:#fff;border-color:#1B2038}
.astat.d span{color:var(--mut-d)}
.blk-h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:32px 0 14px;font-weight:500}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:18px}
table.lst{width:100%;min-width:660px;border-collapse:collapse;font-size:14.5px}
table.lst th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:500}
table.lst td{padding:16px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
table.lst tr:last-child td{border-bottom:0}
table.lst b{font-weight:500}
select.stx{border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:12.5px;font-family:var(--f);background:#fff;color:var(--tx)}
.st{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:99px;white-space:nowrap}
.st-live{background:var(--okt);color:var(--ok)}
.st-mod{background:var(--bronze-t);color:#8A6A20}
.st-dr{background:#EDEEF3;color:var(--mut)}
.lnk{color:var(--blue);font-weight:500}
.lnk:hover{color:var(--blue-d)}

/* ---------- auth ---------- */
.auth{position:relative;background:var(--ink);color:#fff;min-height:100svh;display:grid;place-items:center;padding:150px 24px 100px;overflow:hidden;text-align:center}
.auth .glow{position:absolute;width:800px;height:800px;left:50%;top:-420px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(36,71,230,.4),rgba(36,71,230,0) 62%)}
.authbox{position:relative;z-index:2;width:min(440px,100%)}
.auth h1{font-size:clamp(38px,5vw,58px);margin:16px 0 14px}
.auth .sub{color:rgba(255,255,255,.6);font-size:15.5px;margin:0 auto;max-width:38ch}
.authcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:20px;padding:26px 26px 28px;margin-top:30px;display:grid;gap:16px;text-align:left}
.authcard label.f{color:var(--mut-d)}
.authcard input.f{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16);color:#fff}
.authcard input.f::placeholder{color:rgba(255,255,255,.35)}
.authcard input.f:focus{background:rgba(255,255,255,.09);border-color:var(--blue-l)}
.auth .note{color:var(--mut-d);margin-top:18px}

/* ---------- console ---------- */
.console{display:grid;grid-template-columns:238px minmax(0,1fr);gap:24px;padding:32px 0 96px;align-items:start}
.side{position:sticky;top:88px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px}
.side a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:12px;font-size:14.5px;color:var(--mut);transition:background .2s,color .2s}
.side a:hover{background:var(--paper);color:var(--tx)}
.side a.on{background:var(--ink);color:#fff}
.side a .cnt{font-size:11.5px;font-variant-numeric:tabular-nums;background:var(--blue);color:#fff;border-radius:99px;padding:2px 8px}
.side a.on .cnt{background:rgba(255,255,255,.18)}
.side .sh{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:14px 14px 8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin-bottom:18px}
.panel-d{background:var(--ink);color:#fff;border-color:#1B2038}
.ph{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h3{font-size:19px}
.ph .sub{font-size:13px;color:var(--mut);margin-top:4px}
.panel-d .ph .sub{color:var(--mut-d)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.kpi.d{background:var(--ink);color:#fff;border-color:#1B2038}
.kpi b{font-size:32px;font-weight:600;letter-spacing:-.04em;display:block}
.kpi span{display:block;font-size:11.5px;color:var(--mut);letter-spacing:.07em;text-transform:uppercase}
.kpi.d span{color:var(--mut-d)}
.kpi .delta{font-size:12px;margin-top:8px;display:inline-flex;gap:5px;align-items:center;color:var(--ok)}
.kpi .delta.dn{color:#B0342F}
.todo{display:grid;gap:10px}
.todo a{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#FBFBFD;transition:border-color .2s,transform .2s}
.todo a:hover{border-color:var(--tx);transform:translateX(3px)}
.todo .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px}
.todo .ti.b{background:var(--blue-t);color:var(--blue-d)}
.todo .ti.g{background:var(--bronze-t);color:#8A6A20}
.todo .ti.n{background:#EDEEF3;color:var(--mut)}
.todo b{display:block;font-size:14.5px;font-weight:500}
.todo span{font-size:12.5px;color:var(--mut)}
.todo .go{margin-left:auto;color:var(--mut)}
.funnel{display:grid;gap:10px}
.fstep{display:grid;grid-template-columns:150px minmax(0,1fr) 74px;gap:14px;align-items:center;font-size:13.5px}
.fstep .bar{height:30px;border-radius:8px;background:var(--paper);overflow:hidden}
.fstep .bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),#5B7BFF)}
.fstep .bar i.dim{background:linear-gradient(90deg,#20243A,#3A4166)}
.fstep .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.fstep .lb{color:var(--mut)}
.chart{width:100%;height:190px}
.chart .gl{stroke:var(--line)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:14px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.srcs{display:grid;gap:12px}
.src{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:13.5px}
.src .tr{height:8px;border-radius:99px;background:var(--paper);margin-top:7px;overflow:hidden}
.src .tr i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.src .pc{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.tl{display:grid;gap:0}
.tl div{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tl div:last-child{border-bottom:0}
.tl time{color:var(--mut);flex:none;width:96px;font-variant-numeric:tabular-nums}
.tl b{font-weight:500}
.stfilter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stfilter button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:13px;color:var(--mut);transition:.2s}
.stfilter button:hover{border-color:var(--tx);color:var(--tx)}
.stfilter button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.st-new{background:var(--blue-t);color:var(--blue-d)}
.st-rep{background:#EDEEF3;color:var(--mut)}
.st-nda{background:var(--bronze-t);color:#8A6A20}
.st-view{background:#E6F0FF;color:#1A34AE}
.st-loi{background:var(--okt);color:var(--ok)}
.st-lost{background:#F6E7E6;color:#8E332E}
.qs{display:inline-flex;gap:3px;vertical-align:middle}
.qs i{width:6px;height:12px;border-radius:2px;background:var(--line)}
.qs i.on{background:var(--ok)}
tr.erow{cursor:pointer}
tr.erow:hover td{background:#FAFAFC}
.lrow{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .th{border-radius:12px;overflow:hidden;aspect-ratio:16/10;background:var(--paper)}
.lrow h4{font-size:18px;margin-bottom:6px}
.lrow .meta{font-size:13px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.lrow .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bar-mini{height:6px;border-radius:99px;background:var(--paper);overflow:hidden;margin-top:10px;max-width:280px}
.bar-mini i{display:block;height:100%;background:var(--blue)}
.docrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.docrow:last-child{border-bottom:0}
.docrow .di{width:38px;height:38px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--mut);flex:none}
.docrow .dm{font-size:12.5px;color:var(--mut)}
.docrow .sp{flex:1}
.gate{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--bronze-t);color:#8A6A20;white-space:nowrap}
.gate.open{background:var(--okt);color:var(--ok)}
.sw{position:relative;width:42px;height:24px;border-radius:99px;background:var(--line);flex:none;transition:background .2s;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(18px)}
.chrow{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#FBFBFD;flex-wrap:wrap}
.chrow.on{background:#fff;border-color:var(--line)}
.chrow .chi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-weight:600}
.chrow .chi.wa{background:#25D366}
.chrow .chi.tg{background:#2AABEE}
.chrow .chi.em{background:var(--ink)}
.chrow b{font-weight:500;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chrow span.sp{flex:1}
.chrow>div>span{font-size:12.5px;color:var(--mut);display:block;margin-top:3px;max-width:60ch}
.ladder{display:grid;gap:0;margin-bottom:18px;border-left:2px solid var(--line);padding-left:18px}
.ladder div{padding:10px 0;position:relative}
.ladder div::before{content:"";position:absolute;left:-24px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.ladder b{font-weight:500;font-size:14px;display:block}
.ladder span{font-size:12.5px;color:var(--mut)}
.wait{font-size:11px;font-weight:500;letter-spacing:.04em;padding:5px 10px;border-radius:99px;background:#EDEEF3;color:var(--mut);white-space:nowrap}
.wait.warn{background:var(--bronze-t);color:#8A6A20}
.wait.bad{background:#F6E7E6;color:#8E332E}
.mch{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:inline-flex;align-items:center;gap:5px}
.swrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.swrow:last-child{border-bottom:0}
.swrow b{font-weight:500;font-size:14.5px;display:block}
.swrow span{font-size:12.5px;color:var(--mut)}
.swrow .sp{flex:1}
.drawer{position:fixed;inset:0;z-index:110;display:flex;justify-content:flex-end;background:rgba(6,7,13,.5);backdrop-filter:blur(4px);animation:fade .2s ease}
.dr{background:#fff;width:min(520px,100%);height:100%;overflow:auto;padding:28px 30px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}
.dr h3{font-size:24px;margin:6px 0 4px}
.dr .x{float:right;font-size:24px;color:var(--mut);padding:0 4px}
.dr .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.dr .kv:last-of-type{border-bottom:0}
.dr .kv span{color:var(--mut)}
.dr .msg{background:#FBFBFD;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px;line-height:1.6;margin:16px 0}

/* =============== PHOTOS ===============

const EXT=['jpg','jpeg','png','webp'];

/* Logo: assets/logos/<listing-id>.png  (or .svg / .jpg / .webp).

const LEXT=['png','svg','jpg','webp'];
function logoTile(l,cls){
  const mono=l.name.split(/\s+/).filter(w=>/[A-Za-z0-9]/.test(w[0])).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  return `<span class="ltile ${cls||''}" data-mono="${mono}"><img src="assets/logos/${l.id}.${LEXT[0]}" data-id="${l.id}" data-e="0" alt="${esc(l.name)} logo" onerror="logoFail(this)"></span>`;
}
function logoFail(el){
  const e=+el.dataset.e+1;
  if(e<LEXT.length){el.dataset.e=e;el.src=`assets/logos/${el.dataset.id}.${LEXT[e]}`;return;}
  const p=el.parentElement; p.classList.add('empty'); p.textContent=p.dataset.mono||'';
}
function photo(id,n,alt,strict){
  return `<img src="assets/${id}/${n}.${EXT[0]}" data-id="${id}" data-n="${n}" data-e="0"${strict?' data-strict="1"':''} alt="${esc(alt||'')}" loading="lazy" onerror="phFail(this)">`;
}
function phFail(el){
  const e=+el.dataset.e+1;
  if(e<EXT.length){el.dataset.e=e;el.src=`assets/${el.dataset.id}/${el.dataset.n}.${EXT[e]}`;return;}
  if(el.dataset.strict){const tb=el.closest('.tb');(tb||el).remove();galSync();return;}
  const w=document.createElement('div');
  w.style.cssText='width:100%;height:100%';
  w.innerHTML=cover(el.dataset.id);
  el.replaceWith(w);
}

function galleryHTML(l){
  const N=12;
  return `
  <div class="dmedia" id="gmain">
    ${photo(l.id,1,l.name)}
    <button class="gnav prev" onclick="galStep(-1)" aria-label="Previous photo">‹</button>
    <button class="gnav next" onclick="galStep(1)" aria-label="Next photo">›</button>
    <span class="gcount num" id="gcount"></span>
    ${SHOW_VIDEO?`<div class="play"><button aria-label="Play video tour"><i></i></button></div><div class="lbl">VIDEO TOUR · ${l.vid}</div>`:''}
  </div>
  <div class="thumbs" id="gthumbs">
    ${Array.from({length:N},(_,i)=>`<button class="tb${i?'':' on'}" data-n="${i+1}" onclick="galPick(this)" aria-label="Photo ${i+1}">${photo(l.id,i+1,'',true)}</button>`).join('')}
    ${SHOW_VIDEO?`<button class="tb tbv" onclick="alert('Video tour — prototype')" aria-label="Video tour"><i></i><span>${l.vid}</span></button>`:''}
  </div>`;
}
function galTiles(){return [...document.querySelectorAll('#gthumbs .tb:not(.tbv)')];}
function galSync(){
  const t=galTiles(), c=document.getElementById('gcount');
  if(!c)return;
  const i=t.findIndex(x=>x.classList.contains('on'));
  c.textContent=`${i<0?1:i+1} / ${t.length}`;
  c.style.display=t.length>1?'':'none';
  document.querySelectorAll('.gnav').forEach(b=>b.style.display=t.length>1?'':'none');
  document.getElementById('gthumbs').style.display=t.length>1?'':'none';
}
function galPick(btn){
  const img=btn.querySelector('img'), main=document.querySelector('#gmain img');
  if(!img||!main)return;
  main.src=img.src;
  galTiles().forEach(t=>t.classList.toggle('on',t===btn));
  btn.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  galSync();
}
function galStep(d){
  const t=galTiles(); if(!t.length)return;
  let i=t.findIndex(x=>x.classList.contains('on')); if(i<0)i=0;
  galPick(t[(i+d+t.length)%t.length]);
}
function galKeys(e){
  if(!document.getElementById('gmain')||$('#mroot').innerHTML)return;
  if(e.key==='ArrowLeft')galStep(-1);
  if(e.key==='ArrowRight')galStep(1);
}
addEventListener('keydown',galKeys);

function bindMarket(){
  document.querySelectorAll('.ftabs button').forEach(b=>b.onclick=()=>{FS.type=b.dataset.t;document.querySelectorAll('.ftabs button').forEach(x=>x.classList.toggle('on',x===b));renderGrid();});
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{

/* =============== DEAL DOCUMENTS =============== */
const UNLOCKED = (()=>{try{return JSON.parse(sessionStorage.getItem('okko_unlocked')||'{}')}catch(e){return {}}})();
function unlock(id){UNLOCKED[id]=true;try{sessionStorage.setItem('okko_unlocked',JSON.stringify(UNLOCKED))}catch(e){}}
function dealDocs(l){
  const sale = l.type==='sale';
  return [
    {cat:'Presentation', gate:'open', files:[
      {ext:'PDF',name:(sale?'Teaser — ':'Pitch deck — ')+l.name+'.pdf',size:'1.2 MB'}]},
    {cat:'Presentation', gate:'contacts', files:[
      {ext:'PPTX',name:(sale?'Full presentation':'Investor presentation')+'.pptx',size:'8.4 MB'}]},
    {cat:'Financial documents', gate:'contacts', files:[
      {ext:'XLSX',name:'P&L by month, last 12 months.xlsx',size:'340 KB'},
      {ext:'XLSX',name:sale?'Revenue & cost breakdown.xlsx':'Financial model 2026–2029.xlsx',size:'620 KB'}]},
    {cat:'Legal & licence', gate:'nda', files:[
      {ext:'PDF',name:sale?'Trade licence & lease.pdf':'Corporate documents & term sheet.pdf',size:'2.8 MB'}]}
  ];
}
function docsBlock(l){
  const open = !!UNLOCKED[l.id];
  const groups = dealDocs(l);
  const rows = g => g.files.map(f=>{
    const can = g.gate==='open' || (g.gate==='contacts' && open);
    return `<div class="docrow">
      <span class="di">${f.ext}</span>
      <span><b style="font-weight:500">${f.name}</b><br><span class="dm">${f.size} · ${g.cat}</span></span>
      <span class="sp"></span>
      ${can
        ? `<a class="btn btn-o btn-sm" href="#" onclick="event.preventDefault();alert('Download — prototype')">Download${ic()}</a>`
        : g.gate==='contacts'
          ? `<button class="btn btn-d btn-sm" onclick="openContact('${l.id}','docs')">Leave contacts${ic()}</button>`
          : `<span class="gate">After NDA</span>`}
    </div>`;
  }).join('');
  return `
    ${open?`<p class="unlocked">${VF} Documents unlocked. The owner has your contacts and will follow up.</p>`
          :`<p class="note" style="margin:0 0 14px">The teaser is open to everyone. The presentation and financials unlock right after you leave your contacts — the owner receives them at the same moment. Legal documents open after a signed NDA.</p>`}
    ${groups.map(rows).join('')}
    ${open?'':`<div style="margin-top:18px"><button class="btn btn-d btn-sm" onclick="openContact('${l.id}','docs')">Unlock presentation &amp; financials${ic()}</button></div>`}`;
}

  deck:[{ext:'PDF',name:'Pitch deck 2026.pdf'},{ext:'PPTX',name:'Investor presentation.pptx'}],

function bindWiz(){
  const w=$('#wiz'); if(!w)return;
  w.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{W.type=b.dataset.w;w.innerHTML=wizStep();bindWiz();});
  w.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.add;
    if(k==='logo'){W.data.logo=!W.data.logo;w.innerHTML=wizStep();bindWiz();return;}
    if(k==='video'||k==='photos'){alert('File picker — prototype');return;}
    const pool=DEMO_FILES[k]||[]; const cur=W.files[k]||[];
    const next=pool[cur.length%pool.length];
    W.files[k]=[...cur,next];
    w.innerHTML=wizStep();bindWiz();
  });
  w.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{
    W.files[b.dataset.k].splice(+b.dataset.i,1);w.innerHTML=wizStep();bindWiz();
  });
  w.querySelectorAll('[data-gate]').forEach(s=>s.onchange=()=>{
    W.docs[s.dataset.gate].g=s.value;w.innerHTML=wizStep();bindWiz();
  });
  w.querySelectorAll('.plan').forEach(b=>b.onclick=()=>{W.plan=b.dataset.p;w.innerHTML=wizStep();bindWiz();});
  const nx=$('#wnext'),bk=$('#wback');
  if(nx)nx.onclick=()=>{
    if(W.step===1){const n=$('#w-name'),lo=$('#w-loc'),tg=$('#w-tag'),si=$('#w-site');W.data.name=n?n.value:'';W.data.loc=lo?lo.value:'';W.data.tag=tg?tg.value:'';W.data.site=si?si.value:'';}
    W.step++;w.innerHTML=wizStep();bindWiz();window.scrollTo({top:0,behavior:'instant'});
  };
  if(bk)bk.onclick=()=>{W.step--;w.innerHTML=wizStep();bindWiz();window.scrollTo({top:0,behavior:'instant'});};
}

function sparkline(data,w,h){
  const max=Math.max(...data),min=Math.min(...data),n=data.length;
  const x=i=>(i/(n-1))*w, y=v=>h-((v-min)/(max-min))*(h-14)-7;
  const line=data.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area=`${line} L${w} ${h} L0 ${h} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Views, last 30 days">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2447E6" stop-opacity=".22"/><stop offset="1" stop-color="#2447E6" stop-opacity="0"/></linearGradient></defs>
    ${[0,1,2,3].map(i=>`<line class="gl" x1="0" y1="${(h/4*i+7).toFixed(0)}" x2="${w}" y2="${(h/4*i+7).toFixed(0)}" stroke-width="1"/>`).join('')}
    <path d="${area}" fill="url(#g1)"/>
    <path d="${line}" fill="none" stroke="#2447E6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${w}" cy="${y(data[n-1]).toFixed(1)}" r="4.5" fill="#2447E6"/>
  </svg>`;
}

function waitPill(e){
  if(e.st!=='new') return '<span class="wait">Answered</span>';
  const h=e.waited||0;
  const cls=h>=24?'bad':h>=6?'warn':'';

  return `<span class="wait ${cls}">${h} h · ${note}</span>`;
}

function mask(s){return s.replace(/^(.{2}).*(@.*)$/,'$1···$2').replace(/^(\+\d{3} \d{2}) \d{3}/,'$1 ···');}
function drawerHTML(e){

  return `
    <button class="x" onclick="closeModal()" aria-label="Close">×</button>
    <p class="eyebrow">${e.ch} · ${e.date}</p>
    <h3>${e.name}</h3>
    <p style="color:var(--mut);font-size:14px;margin-bottom:14px">${e.who}</p>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:18px">${stPill(e.st)} ${score(e.score)}</div>

    <div class="kv"><span>Listing</span><b>${e.listing}</b></div>
    <div class="kv"><span>Stated ticket</span><b>${e.ticket}</b></div>
    <div class="kv"><span>Timeline</span><b>${e.horizon}</b></div>
    <div class="kv"><span>NDA</span><b>${e.nda}</b></div>
    <div class="kv"><span>Email</span><b>${e.shared?e.mail:mask(e.mail)}</b></div>
    <div class="kv"><span>Phone</span><b>${e.shared?e.phone:mask(e.phone)}</b></div>
    ${e.shared?'':`<p class="note" style="margin:10px 0 0">Contacts stay masked until you reply — the conversation runs through OKKO CAP.
      <button class="lnk" onclick="enqAct('${e.id}','reveal')" style="font-size:12.5px">Reveal contacts</button></p>`}

    <h4 class="dsub">Conversation</h4>
    <div class="thread">${e.thread.map(bubble).join('')}</div>

    <div class="tpls">${TPL.map((t,i)=>`<button class="tpl" onclick="useTpl(${i})">${t[0]}</button>`).join('')}</div>
    <textarea class="f" id="reply" rows="3" placeholder="Write a reply to ${e.name}…"></textarea>
    <div class="acts">
      <button class="btn btn-b full" onclick="enqAct('${e.id}','send')">Send reply${ic()}</button>
      ${e.st==='nda'||e.st==='loi'?'':`<button class="btn btn-o full" onclick="enqAct('${e.id}','nda')">Send the NDA${ic()}</button>`}
      <button class="btn btn-o full" onclick="enqAct('${e.id}','slots')">Propose a viewing${ic()}</button>
      <div id="slots"></div>
      <button class="btn btn-o full" onclick="enqAct('${e.id}','loi')">Mark as LOI signed${ic()}</button>
      <button class="btn btn-o full" onclick="enqAct('${e.id}','lost')">Mark as lost${ic()}</button>
    </div>
    <label class="f" style="margin-top:20px">Status</label>
    <select class="f" onchange="setEnqSt('${e.id}',this.value)">${Object.entries(ENQ_ST).map(([k,v])=>`<option value="${k}" ${k===e.st?'selected':''}>${v.l}</option>`).join('')}</select>
    <p class="note">Replies are delivered by email and WhatsApp from a masked OKKO CAP address, and a copy stays here. Every action is logged in the deal history.</p>`;
}
function openEnq(id){
  const e=ENQ.find(x=>x.id===id); if(!e)return;
  $('#mroot').innerHTML=`<div class="drawer" onclick="if(event.target===this)closeModal()">
    <div class="dr" id="drw" role="dialog" aria-modal="true" aria-label="Enquiry">${drawerHTML(e)}</div></div>`;
  document.addEventListener('keydown',escClose);
}
function redrawEnq(e){
  const d=$('#drw'); if(d){d.innerHTML=drawerHTML(e);d.scrollTop=0;}
  const b=$('#accbody'); if(b){b.innerHTML=accBody();bindAcc();}
}
function useTpl(i){const t=$('#reply'); if(t){t.value=TPL[i][1];t.focus();}}
function enqAct(id,what,arg){
  const e=ENQ.find(x=>x.id===id); if(!e)return;
  const now='Aug 16 · '+(['14:05','14:22','15:10','16:04'][e.thread.length%4]);
  if(what==='send'){
    const t=$('#reply'), v=t?t.value.trim():'';
    if(!v){t&&t.focus();return;}
    e.thread.push(['you',now,v]);
    if(e.st==='new')e.st='replied';
    e.shared=true;
  }
  if(what==='nda'){e.thread.push(['sys',now,'NDA sent for signature — the buyer gets a link by email']);e.st='ndasent';e.nda='Sent, awaiting signature';}
  if(what==='slots'){
    const box=$('#slots');
    if(box)box.innerHTML=`<div class="slots">${SLOTS.map(s=>`<button class="tpl" onclick="enqAct('${id}','viewing','${s}')">${s}</button>`).join('')}</div>`;
    return;
  }
  if(what==='viewing'){e.thread.push(['sys',now,'Viewing proposed: '+arg+' — invitation sent to the buyer']);e.st='viewing';}
  if(what==='loi'){e.thread.push(['sys',now,'LOI marked as signed — due diligence started']);e.st='loi';}
  if(what==='lost'){e.thread.push(['sys',now,'Marked as lost — the buyer stays in your history']);e.st='lost';}
  if(what==='reveal'){e.shared=true;e.thread.push(['sys',now,'You shared your direct contacts with the buyer']);}
  redrawEnq(e);
}
function setEnqSt(id,v){const e=ENQ.find(x=>x.id===id);if(e){e.st=v;redrawEnq(e);}}
function bindAcc(){
  document.querySelectorAll('.stfilter button').forEach(b=>b.onclick=()=>{ACC.f=b.dataset.f;$('#accbody').innerHTML=accBody();bindAcc();});
  document.querySelectorAll('tr.erow').forEach(r=>r.onclick=()=>openEnq(r.dataset.e));
  document.querySelectorAll('.sw').forEach(s=>{s.onclick=()=>s.classList.toggle('on');s.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();s.classList.toggle('on');}}});
}

/* =============== ROUTER =============== */
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const app=$('#app');
  closeModal();
  if(h.startsWith('deal/')){renderHeader('market');app.innerHTML=dealPage(h.slice(5));}
  else if(h.startsWith('market')){
    const q=new URLSearchParams(h.split('?')[1]||'');
    if(q.get('t'))FS.type=q.get('t');
    renderHeader('market');app.innerHTML=marketPage();bindMarket();
  }
  else if(h==='list'){W.step=0;renderHeader('list');app.innerHTML=listPage();bindWiz();}
  else if(h==='account'||h.startsWith('account/')){
    const t=h.split('/')[1]||'overview';
    ACC.tab=TABS.some(x=>x[0]===t)?t:'overview';
    renderHeader('account');app.innerHTML=accountPage();bindAcc();
  }
  else if(h==='login'){renderHeader('login');app.innerHTML=loginPage();}
  else if(h==='advisory'){renderHeader('advisory');app.innerHTML=advisoryPage();}
  else{renderHeader('home');app.innerHTML=homePage();}
  window.scrollTo({top:0,behavior:'instant'});
  onScroll();
}
const hdr=document.getElementById('hdr');
function onScroll(){hdr.classList.toggle('stuck',window.scrollY>24);}
